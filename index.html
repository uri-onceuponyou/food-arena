<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Food Fight Arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;800;900&family=Heebo:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #16101f; font-family: 'Heebo', sans-serif; }
    #game { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    #boot {
      position: fixed; inset: 0; display: grid; place-items: center;
      color: #FFF3DE; font-family: 'Rubik', sans-serif; font-weight: 800; letter-spacing: 0.04em;
      background: radial-gradient(circle at 50% 35%, #4a2a5e 0%, #16101f 70%);
      z-index: 50; transition: opacity .4s ease;
    }
    #boot.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="boot">Heating the kitchen…</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
