  <!-- ── HOME SCREEN. This is the biggest measured win available to the phone, and until
       now it did not exist at all. ───────────────────────────────────────────────────

       WHAT WAS MEASURED, page-side, on the shipped production bundle (`docs/PHONE.md` §1
       and §5.1): the served document carried NO `<link rel="manifest">` and NO
       `apple-mobile-web-app-capable`. Without either signal iOS opens a home-screen
       shortcut in BROWSER display mode — chrome and all — so **"Add to Home Screen"
       bought nothing.**

       WHAT IT IS WORTH, MEASURED — `node tools/tmp/sc2_screen.mjs`, which loads the real
       game at each viewport and reads the CANVAS RECT our own `Stage.resize()` computed.
       Five devices, tab viewport vs full screen:

           iPhone 15   LANDSCAPE   canvas 734x343 -> 852x393    75.2% of screen -> 100.0%
           iPhone 14   LANDSCAPE   canvas 750x340 -> 844x390    77.5%           -> 100.0%
           16 Pro Max  LANDSCAPE   canvas 838x390 -> 956x440    77.7%           -> 100.0%
           Pixel 7     LANDSCAPE   canvas 840x360 -> 915x412    80.2%           -> 100.0%

       🚨 AND IN PORTRAIT IT IS WORTH **NOTHING**, WHICH WAS NOT OBVIOUS AND IS THE MOST
       USEFUL THING THIS PASS MEASURED:

           iPhone 15   PORTRAIT    viewport 393x659 -> 393x852   (+193 px of height)
                                   canvas  393x295 -> 393x295    34.6% -> 34.6%  (ZERO)

       The two losses are NOT additive. In portrait the canvas is **width-bound by the 4:3
       mask** — `Stage.resize()` sets `h = cw / (4/3)`, which does not read the viewport
       height at all — so every one of those 193 extra pixels lands in the letterbox. The
       screenshots make it plainer than the number does: `shots/sc2/SHIPPED_iPhone_15_tab
       .png` and `..._standalone.png` show the SAME arena strip with more empty dark space
       around it. Portrait standalone is not bigger; it is emptier.
       => **The manifest is a LANDSCAPE win.** Portrait needs the rotate prompt that
       `DECISIONS §14` already decided on ("i think the game should be landscape. Portrait
       can't serve the game."), and that prompt lives in `src/ui/**`, not here.

       🚨 AND THE CHROME LOSS IS OTHERWISE PERMANENT. iOS Safari collapses its toolbar
       when a page scrolls; this page can never scroll (`overflow: hidden` below, plus
       `body { position: fixed }`, measured `scrollHeight === innerHeight` in both
       orientations). That CSS is CORRECT for a game — allowing scroll would trade chrome
       for a rubber-banding play surface — so the numbers above are not a worst case,
       they are the only case. A home-screen launch is the only way out of it on iOS.

       WHAT THESE TAGS CANNOT DO, so nobody re-derives it. **They cannot lock an iPhone to
       landscape.** From MDN's browser-compat-data, fetched rather than recalled:
         • manifest `orientation`      -> `safari: false` -> `safari_ios: false`
         • `ScreenOrientation.lock()`  -> `safari: false` (desktop AND iOS)
         • `Element.requestFullscreen` -> iOS 16.4 *partial*: "Only available on iPad,
                                          not on iPhone"
         • manifest `display: standalone` -> `safari_ios: 11.3` ✅ — the half that works
       So a PWA gets FULLSCREEN on iPhone and NOT landscape lock, and no code in `src/`
       can change that. `orientation: landscape` in the manifest is honoured on Android
       Chrome (where it also grants a real lock) and inert on iOS. Landscape lock on
       iPhone is the native wrapper's job — `docs/DECISIONS-FOR-URI.md` §51a, decided.
       ⚠️ Deliberately NO `ScreenOrientation.lock()` call anywhere: on iOS it is a silent
       no-op, and a lock that silently does nothing is worse than none — it reads as
       shipped in the diff and as broken on the device.

       WHY `black-translucent`. It puts the app UNDER the status bar, so the web view gets
       the FULL screen rather than the screen minus a status bar; the safe-area plumbing
       that makes that survivable already exists (`src/ui/screens/theme.ts` reads
       `env(safe-area-inset-*)`, and the `viewport-fit=cover` above is what makes those
       insets report anything but 0). ⚠️ Not measured on hardware — Chromium reports
       `env(safe-area-inset-*)` as 0 whatever it is emulating, so the inset half of this is
       a platform claim. The `menu_accept` battery already runs a notch/no-notch axis.

       WHY BOTH `apple-mobile-web-app-capable` AND `mobile-web-app-capable`. The Apple-
       prefixed name is the one iOS has honoured since 11.3 and still does; the unprefixed
       one is the standard Chrome reads and warns about the absence of. They are two
       spellings of one intent and cost 60 bytes.

       WHY THE MANIFEST HREF MAY BE ROOT-ABSOLUTE WHEN THE MANIFEST'S OWN URLS MAY NOT.
       The rule is "does Vite PARSE this position", not "which directory is the file in".
       Vite's HTML transform has an explicit `noInlineLinkRels` set containing `manifest`,
       `icon` and `apple-touch-icon`, so it RESOLVES and RE-BASES these three hrefs the
       same way it does the font preloads below — verified in the emitted bundle at `/`,
       `/food-arena/` and `./`. It does NOT parse `manifest.webmanifest`, so every URL
       INSIDE that file is relative. `node tools/tmp/sc2_manifest.mjs` builds at three
       bases and re-injects both the de-based href and a root-absolute icon path as
       required failures — a guard that has not been shown to FAIL is not a guard. -->

  <!-- ── FONTS ARE SELF-HOSTED. This used to be three <link> tags to Google Fonts and
       they were the ONLY external request the game made. ─────────────────────────────

       WHAT IT COST. Measured at 844x390 with the CDN unreachable (`docs/APP.md` §8):
       `document.fonts.size` 33 -> 0, the whole UI drops to the platform sans, and the
       home screen's weapon caption CLIPS — "Tomato Toss –" re-wraps and loses its
       leading T off the left edge of its pill. No shipped gate saw it, because every
       gate runs with the network up. An app is offline by definition, and on the web
       this also removes a render-blocking third-party request (DNS + TLS to
       fonts.googleapis.com, then a SECOND connection to fonts.gstatic.com) from the
       critical path of every single page load.

       WHY ONLY TWO FILES, when Google served 33 @font-face rules. Both families are
       VARIABLE: the 33 rules are backed by 11 distinct binaries, and one file serves all
       three weights of a family. Of those 11, this app was measured fetching four —
       rubik-latin, heebo-latin, and (only on `settings`) heebo-symbols and heebo-math.
       `tools/tmp/ft_glyphs.mjs` then asked the question a request waterfall cannot
       answer — does the file actually DRAW the glyph? — and the answer for those last
       two was **0 of 44 candidate codepoints**. Chromium downloads them because their
       `unicode-range` DECLARATION matches ←, →, ⚙, ✓, 🏆 and so on, then finds no glyph
       and falls through to the platform font anyway. So they are 38,016 bytes and two
       requests that buy nothing, and dropping them makes `settings` render IDENTICALLY
       with two fewer requests than before this change. Rubik's latin-ext, cyrillic and
       cyrillic-ext, and Heebo's latin-ext, have ZERO matching codepoints anywhere in
       `src/**/*.ts` — statically proven, not sampled.

       WHY THE WEIGHTS ARE LISTED SEPARATELY instead of one `font-weight: 400 900` range.
       A variable face declared with a RANGE would let `font-weight: 400` on a Rubik
       element resolve to wght=400. Today it cannot: Google declares Rubik at 700/800/900
       only, so CSS font matching sends a request for 400 to the 700 face. Declaring the
       same discrete weights reproduces that matching EXACTLY — a range would silently
       re-render every `font-weight: 500`/`600` in the tree.

       WHY `swap` AND NOT `block`. `swap` is what `&display=swap` gave us, so the swap
       policy does not move — this change is about WHERE the bytes come from, nothing
       else. `block` was rejected because the first thing this page paints is the boot
       curtain ("Heating the kitchen…") in Rubik, and `block` would leave it INVISIBLE for
       up to 3 s if the font were ever slow, which is `CLAUDE.md` #4's failure mode
       installed deliberately. `optional` was rejected on a number: its 100 ms block with
       NO swap period means one slow first load renders the fallback PERMANENTLY for that
       page load — i.e. it would re-create the exact clip this block removes, and make it
       non-reproducible. The FOUT window `swap` leaves is instead closed by the two
       preloads below, which start the fetch during HTML parse rather than at first
       layout. `crossorigin` on a preload of a font is REQUIRED even same-origin: fonts
       are always fetched in CORS mode, and a preload without it is discarded and the
       font is fetched twice.

       🚨 THE PATHS. `public/` is copied VERBATIM and is not rewritten, so a hand-typed
       path here is the same class of bug as `music.ts`'s `/audio/…` literal, which
       shipped as a permanent 404 on Pages and survived 427 audio assertions. These are
       root-absolute PUBLIC paths, which Vite DOES resolve and re-base in both an HTML
       `href` and a CSS `url()` — verified in the emitted bundle at `/`, `/food-arena/`
       and `./`, and gated by `tools/tmp/ab_basepath.mjs --selftest`.

       Provenance: Google Fonts CSS2 API, Rubik v31 / Heebo v28, `latin` subset, fetched
       verbatim — the same binaries the CDN was serving, so the metrics cannot have
       moved. SIL Open Font License 1.1; see `public/fonts/OFL.txt`, which ships. -->

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #16101f; font-family: 'Heebo', sans-serif; }
    /* The page itself must NEVER scroll. Anything that can overflow scrolls inside
       its own box (`.fa-scroll`) — the only way one layout survives both a 844x390
       phone in landscape and a 2560x1080 ultrawide. */
    body { position: fixed; inset: 0; overscroll-behavior: none; }
    /* ── Layer stack, stated explicitly ──────────────────────────────────────
       game 0  <  hud 20  <  screens 40  <  boot 200.
       These used to be implicit in DOM order plus the z-index each layer's own
       root happened to carry, which is fragile: the post-match "back to menu"
       button MUST paint and hit-test above the HUD's full-viewport game-over
       scrim, and that ordering deserves to be a decision rather than an accident. */
    #game { position: fixed; inset: 0; z-index: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    /* pointer-events:none so mouse/click input passes through to the canvas below;
       the interactive bits (e.g. the Play Again button) re-enable it themselves. */
    #hud { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
    /* Menu / screen layer.
       pointer-events:none is LOAD-BEARING, not tidiness. This div covers the whole
       viewport at all times, including during a match when it holds nothing but the
       pause chip. With the default `auto` it becomes the hit target for every
       pointer event in the frame, and the game canvas underneath receives NOTHING —
       measured as 0 mousemove and 0 mousedown reaching the canvas mid-match, which
       silently disabled firing AND aim-facing at once (input.ts never sees a mouse,
       so `mouseNdc` stays null, so match.ts never builds an aim vector, so the
       fighter's facing freezes). Interactive children opt back in with
       `pointer-events: auto` — the exact pattern `ui/hud.ts` already uses one layer
       down, where the same trap is called out in its own comments. */
    #screens { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
    #boot {
      position: fixed; inset: 0; display: grid; place-items: center;
      color: #FFF3DE; font-family: 'Rubik', sans-serif; font-weight: 800; letter-spacing: 0.04em;
      background: radial-gradient(circle at 50% 35%, #4a2a5e 0%, #16101f 70%);
      z-index: 200; transition: opacity .4s ease;
    }
    #boot.hidden { opacity: 0; pointer-events: none; }
