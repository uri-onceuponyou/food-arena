<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Fight Arena — Piece Preview</title>
  <!-- ── THE SAME SELF-HOSTED FACES AS `index.html`, AND TODAY THEY ARE INERT ────────
       Stated plainly because "inert" is a claim, not an excuse:

       This harness renders NO UI type. `src/preview.ts` contains zero references to
       Rubik, Heebo, `theme.ts` or any font at all, and the one string on the page —
       `#label` — pins `ui-monospace, SFMono-Regular, Menlo, monospace` and is hidden
       outright in shot mode. So nothing here has ever matched these families, this file
       never carried the Google Fonts <link> that `index.html` did, and **no typographic
       measurement in `tools/` has ever flowed through this document.** 53 tools render
       through it; all of them are looking at geometry.

       `@font-face` with a `unicode-range` is LAZY — the browser fetches the file only
       when it lays out a matching codepoint in that family — so declaring these costs
       those 53 tools zero bytes and zero requests until something here actually asks for
       Rubik. That is the point: the day a piece-preview overlay does want the real face,
       it gets the SAME binaries at the SAME weights as the app, instead of quietly
       measuring the platform sans.

       ⚠️ DELIBERATELY NO `<link rel="preload">`, unlike `index.html`. A preload is
       unconditional: it would pull 65,472 bytes on every one of those 53 tools' page
       loads to serve text that does not exist. The preloads belong where the type does.

       🚨 THIS BLOCK MUST STAY BYTE-IDENTICAL TO `index.html`'s. Two copies of a font
       stack that drift is exactly how a harness starts measuring a different typeface
       from the app and nobody notices. `node tools/tmp/ft_faces.mjs --selftest` diffs
       the two files and FAILS if they disagree — that check exists because a comment
       asking for discipline is not a check. -->
  <style>
    @font-face {
      font-family: 'Rubik'; font-style: normal; font-weight: 700; font-display: swap;
      src: url('/fonts/rubik-v31-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Rubik'; font-style: normal; font-weight: 800; font-display: swap;
      src: url('/fonts/rubik-v31-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Rubik'; font-style: normal; font-weight: 900; font-display: swap;
      src: url('/fonts/rubik-v31-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Heebo'; font-style: normal; font-weight: 400; font-display: swap;
      src: url('/fonts/heebo-v28-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Heebo'; font-style: normal; font-weight: 600; font-display: swap;
      src: url('/fonts/heebo-v28-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Heebo'; font-style: normal; font-weight: 800; font-display: swap;
      src: url('/fonts/heebo-v28-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #16101f; }
    #stage { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    #label {
      position: fixed; left: 12px; top: 10px; z-index: 10;
      font: 600 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: rgba(255,255,255,0.62); letter-spacing: 0.03em;
      pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    /* Screenshot mode strips all chrome so the critic judges pixels, not our UI. */
    body.shot #label { display: none; }
  </style>
