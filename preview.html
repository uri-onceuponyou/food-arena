<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Fight Arena — Piece Preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #16101f; }
    #stage { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    #label {
      position: fixed; left: 12px; top: 10px; z-index: 10;
      font: 600 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: rgba(255,255,255,0.62); letter-spacing: 0.03em;
      pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    /* Screenshot mode strips all chrome so the critic judges pixels, not our UI. */
    body.shot #label { display: none; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="label"></div>
  <script type="module" src="/src/preview.ts"></script>
</body>
</html>
