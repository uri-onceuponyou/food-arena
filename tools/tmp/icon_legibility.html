<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>icon legibility — identify at real size</title>
<style>
  /* NOTHING here is zoomed. Every wrapper below is the REAL shipped box, at the REAL
     shipped px size, taken from src/ui/hud.ts and src/ui/screens/characterSelect.ts.
     The page background is the same warm cream the previous acceptance sheet used, so
     before/after plates are comparable. */
  html, body { margin: 0; background: #E8DCC4; font-family: system-ui, sans-serif; }
  #grid { display: grid; gap: 14px; padding: 14px; width: max-content; }
  .item { display: flex; flex-direction: column; align-items: center; }
  .idx { font: 500 10px ui-monospace, monospace; color: #8a7c66; margin-top: 3px; }

  /* HUD weapon slot, desktop (>720px): hud.ts:1446 + hud.ts:1497 */
  .slot26 { width: 58px; height: 58px; background: #FFF3DE; border: 3px solid #1a1224;
            border-radius: 16px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 3px 0 rgba(0,0,0,0.35); font-size: 26px; }
  /* HUD weapon slot, phones (max-width:720px): hud.ts:1989-1990. THE SMALLEST SHIPPED SIZE. */
  .slot20 { width: 46px; height: 46px; background: #FFF3DE; border: 3px solid #1a1224;
            border-radius: 13px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 3px 0 rgba(0,0,0,0.35); font-size: 20px; }
  /* The shipped drop-shadow on .hud-weapon-emoji. It ships, so it is measured. */
  .slot26 .fa-ic, .slot20 .fa-ic { filter: drop-shadow(0 1px 1px rgba(0,0,0,0.5)); }

  /* Character select ability row, at the BOTTOM of its clamp: 1.35rem = 21.6px. */
  .ability { width: 34px; height: 34px; background: #FFFFFF; border: 2.5px solid #1a1224;
             border-radius: 11px; display: flex; align-items: center; justify-content: center;
             font-size: 21.6px; }
</style>
</head>
<body>
<div id="grid"></div>
<script type="module">
import { icon, ensureIconStyles } from '/src/ui/icons/index.ts';
import { FOOD_ICONS } from '/src/ui/icons/food.ts';
import { UI_ICONS } from '/src/ui/icons/ui.ts';

ensureIconStyles();

const q = new URLSearchParams(location.search);
const box = q.get('box') ?? 'slot20';
const set = q.get('set') ?? 'food';
const seed = Number(q.get('seed') ?? 1);
const cols = Number(q.get('cols') ?? 7);
const showIdx = q.get('idx') !== '0';
const only = q.get('only');

/** mulberry32 — a deterministic shuffle so a plate can be regenerated exactly. */
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

let names = set === 'ui' ? Object.keys(UI_ICONS) : Object.keys(FOOD_ICONS);
if (only) names = only.split(',');
const r = rng(seed);
for (let i = names.length - 1; i > 0; i--) {
  const j = Math.floor(r() * (i + 1));
  [names[i], names[j]] = [names[j], names[i]];
}

const grid = document.getElementById('grid');
grid.style.gridTemplateColumns = `repeat(${cols}, max-content)`;
grid.innerHTML = names.map((n, i) =>
  `<div class="item"><div class="${box}">${icon(n)}</div>` +
  (showIdx ? `<div class="idx">${i + 1}</div>` : '') + '</div>').join('');

window.__key = names.map((n, i) => ({ i: i + 1, name: n }));
window.__ready = true;
</script>
</body>
</html>
