<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>HUD harness</title>
    <style>
      /* ── THIS LINE IS THE INSTRUMENT, NOT DECORATION ────────────────────────
         `index.html:15` applies `* { box-sizing: border-box }` to the whole game and
         this harness did not. `.hud-zone` is `width: 196px; padding: 5px 9px 6px;
         border: 3px`, so under content-box the harness laid it out at
         196 + 18 + 6 = 220px — 12% wider than the game renders it.

         That is not a cosmetic difference. `tools/tmp/hud_fit.mjs` exists to prove the
         zone pill CONTAINS its own text and reported `pillW=220` and `overflow=0px` at
         every viewport and every state; `hud.ts` quotes that result in a source comment
         ("Verified 0px overflow at 5 viewports x 3 states"). Measured on the shipped
         196px plate through the real game, the same text sits up to 15.1px OUTSIDE it.
         The 24px of phantom slack was exactly enough to make an overflowing row fit.

         docs/LESSONS.md section 13: a harness can invert the very thing you are
         measuring. Confirm the harness reproduces the shipped layout before trusting
         any number taken through it. */
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #6b4a2f; }
      /* A mid warm ground under the HUD so contrast judgements are made against
         something arena-like rather than white. */
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <script type="module">
      // Isolated DOM harness for src/ui/hud.ts. The radar is pure DOM/CSS, so this
      // renders EXACTLY what the game renders for that widget, without paying ~40 s of
      // SwiftShader boot per sample — and it lets a probe drive `maxSafeRadius` and the
      // clock directly, which is how the fix gets verified at more than one
      // MATCH_DURATION_MS without editing rules.ts (owned by a peer).
      import { createHud } from '/src/ui/hud.ts';
      import { MATCH_DURATION_MS } from '/src/game/rules.ts';
      import { FAIR_PLAY } from '/src/render/camera.ts';

      // Published so a probe never has to hardcode either of them.
      window.__matchDurationMs = MATCH_DURATION_MS;
      window.__fairRadiusUnits = FAIR_PLAY.radiusUnits;

      // ?touch=1 reproduces what src/game/touch.ts puts on <html> on a touch-capable
      // device, which is what moves the radar out of the bottom-right thumb zone.
      if (new URLSearchParams(location.search).has('touch')) {
        document.documentElement.classList.add('fa-touch-capable', 'fa-touch');
      }

      const hud = createHud(document.getElementById('hud'), { onRestart() {} });

      function fighter(id, x, y, hp, maxHp) {
        return {
          role: 'player', characterId: id, x, y, hp, maxHp, alive: hp > 0,
          facing: 0, speed: 0, lastUsed: [0, 0, 0, 0], statuses: [], vx: 0, vy: 0,
        };
      }

      window.__hudSet = (o) => {
        const aw = o.arenaW ?? 1400;
        const ah = o.arenaH ?? 1000;
        const state = {
          phase: o.phase ?? 'playing',
          elapsed: o.elapsed ?? 0,
          countdownValue: 0,
          countdownTick: 0,
          startFlashTimer: 0,
          timeRemaining: o.timeRemaining ?? 0,
          safeRadius: o.safeRadius,
          player: fighter('hamburger', o.px ?? 700, o.py ?? 780, o.php ?? 100, 100),
          enemy: fighter('donut', o.ex ?? 1240, o.ey ?? 500, o.ehp ?? 150, 150),
          projectiles: [], splats: [], trailMarks: [],
          winner: o.winner ?? null,
          arena: {
            id: 'kitchen', displayName: 'Kitchen',
            width: aw, height: ah,
            center: { x: aw / 2, y: ah / 2 },
            maxSafeRadius: o.maxSafeRadius,
            playerSpawn: { x: 160, y: ah / 2 }, enemySpawn: { x: aw - 160, y: ah / 2 },
            cover: [], hazards: [], build() {},
          },
          nextId: 1,
        };
        hud.update(state, { selectedWeapon: 0, safeArrow: null, aim: null });
        return true;
      };

      window.__harnessReady = true;
    </script>
  </body>
</html>
